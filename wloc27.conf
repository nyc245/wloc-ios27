#!name=WLOC27
#!desc=gs-loc rewrite

[MITM]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com

[Script]
wloc27 = type=http-response,pattern=^https?://gs-loc[^/]*\.apple\.com(\.cn)?/clls/,requires-body=1,max-size=1048576,script-path=https://gcore.jsdelivr.net/gh/nyc245/wloc-ios27@main/scripts/wloc27.js,argument=lat=30.274100&lon=120.155100&accuracy=20&ttlMode=short&patchAll=1&logLevel=debug

[URL Rewrite]
^https?://www\.baidu\.com url 302 https://www.apple.com

[Rule]
FINAL,PROXY