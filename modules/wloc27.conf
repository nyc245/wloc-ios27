# WLOC27 定位改写 · iOS 26/27 · Quantumult X
# ─────────────────────────────────────────────────────────────
# 把两处 USER 换成你的 GitHub 用户名（仓库名 wloc-ios27）
# 说明：QuanX 的脚本不能伪造 request 响应，选点页「储存到设备」这条链路走不通，
#       QuanX 用户把坐标直接写进 rewrite 脚本参数（见 README「QuanX 固定坐标」）。
#       想要选点页 + 快捷指令切坐标，用 Surge / Loon / Stash / 小火箭。
# ─────────────────────────────────────────────────────────────

[rewrite_local]
^https?://gs-loc[^/]*\.apple\.com(\.cn)?/clls/ url script-response-body https://cdn.jsdelivr.net/gh/USER/wloc-ios27@main/scripts/wloc27.js

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com
